name: Style

# Style runs only on the files you actually touched, so nobody is ever blocked
# by a lint error somewhere else in the repo.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet ruff

      - name: Check the Python files this pull request touched
        run: |
          files=$(git diff --name-only --diff-filter=ACMR \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            -- '*.py')
          if [ -z "$files" ]; then
            echo "No Python files changed."
            exit 0
          fi
          echo "$files"
          ruff check --output-format=github $files
          ruff format --check --diff $files
