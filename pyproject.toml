[project]
name = "research-gym"
version = "0.1.0"
description = "A shared gym for getting good at AI research and engineering."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# Installed by CI. You do not need these locally - the pull request runs them for you.
checks = ["pytest>=8.0", "pytest-json-report>=1.5"]
# From module 04 onwards.
torch = ["torch>=2.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gym*"]

[tool.pytest.ini_options]
testpaths = ["modules"]
addopts = "-q --strict-markers"
markers = ["stretch: optional extension, not required to pass a module"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Deliberately modest. This is a learning repo: style should teach, not nag.
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # obvious bugs
    "D",    # docstrings, see the relaxations below
    "ANN201", "ANN001",  # annotate public functions and their arguments
]
ignore = [
    "D100",  # module docstring not required in submissions
    "D104",
    "D203", "D213",  # conflicting docstring styles
    "E501",  # the formatter handles line length
]

[tool.ruff.lint.per-file-ignores]
"modules/*/starter/*" = ["D", "ANN", "B", "F"]   # starters are full of TODOs on purpose
"modules/*/tests/*" = ["D", "ANN"]
"**/checks.py" = ["D103", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"
